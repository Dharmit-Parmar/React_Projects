<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Manager | Universal Converter</title>
    <style>
      .initial-loader {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: #0f172a;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #f8fafc; font-family: 'Outfit', sans-serif;
      }
      .spinner {
        width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1);
        border-left-color: #818cf8; border-radius: 50%;
        animation: spin 1s linear infinite; margin-bottom: 24px;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .loader-text {
        font-weight: 600;
        letter-spacing: 0.05em;
        background: linear-gradient(to right, #818cf8, #d8b4fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
