version: '3.8'

services:
  pdf-manager:
    build: .
    ports:
      - "5173:5173"
      - "3001:3001"
    volumes:
      # Persist uploaded/converted files between container restarts
      - uploads_data:/app/uploads
    environment:
      - PORT=3001
    # Optional: uncomment and add your key for the PDF→DOCX API feature
    # env_file:
    #   - .env

volumes:
  uploads_data:
